server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # Configuration CORS globale (Angular : http://localhost:4200)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
      # Le routage dynamique est declare par le bean DiscoveryClientRouteDefinitionLocator
      # (ne PAS activer spring.cloud.gateway.discovery.locator.enabled=true, sinon routes en double)
      discovery:
        locator:
          lower-case-service-id: true

      # ---------------------------------------------------------------
      # Routage STATIQUE (alternative, laisse en commentaire)
      # ---------------------------------------------------------------
      # routes:
      #   - id: r1
      #     uri: lb://CUSTOMER-SERVICE
      #     predicates:
      #       - Path=/api/customers/**
      #   - id: r2
      #     uri: lb://EBANK-SERVICE
      #     predicates:
      #       - Path=/api/accounts/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
