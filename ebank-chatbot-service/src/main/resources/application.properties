spring.application.name=ebank-chatbot-service
server.port=8083

# Config Server (optional: le service demarre meme si config-service est arrete)
spring.config.import=optional:configserver:http://localhost:9999

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=*

# Swagger UI : http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------
# Spring AI - Groq (compatible OpenAI)
# ---------------------------------------------------------------
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.0

# ---------------------------------------------------------------
# Spring AI - MCP Client (transport SSE vers les 2 microservices)
# ---------------------------------------------------------------
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=ebank-chatbot-mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.sse.connections.customer-server.url=http://localhost:8081
spring.ai.mcp.client.sse.connections.customer-server.sse-endpoint=/sse
spring.ai.mcp.client.sse.connections.ebank-server.url=http://localhost:8082
spring.ai.mcp.client.sse.connections.ebank-server.sse-endpoint=/sse

# ---------------------------------------------------------------
# Bot Telegram (long polling) - desactive par defaut
#   TELEGRAM_BOT_ENABLED=true  et  TELEGRAM_BOT_TOKEN=<token BotFather>
# ---------------------------------------------------------------
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# ---------------------------------------------------------------
# Bot Discord (JDA) - desactive par defaut
#   DISCORD_BOT_ENABLED=true  et  DISCORD_BOT_TOKEN=<token du portail developpeur>
# ---------------------------------------------------------------
discord.bot.enabled=${DISCORD_BOT_ENABLED:false}
discord.bot.token=${DISCORD_BOT_TOKEN:}