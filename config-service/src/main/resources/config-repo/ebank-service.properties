# Configuration centralisee de ebank-service
ebank.config.welcome-message=Bienvenue dans ebank-service (configuration fournie par config-service)
ebank.config.default-currency=MAD
management.endpoints.web.exposure.include=*

spring.datasource.url=jdbc:h2:mem:ebank-db;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true