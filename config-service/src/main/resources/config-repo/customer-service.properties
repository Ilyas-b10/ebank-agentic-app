# Configuration centralisee de customer-service
customer.config.welcome-message=Bienvenue dans customer-service (configuration fournie par config-service)
customer.config.max-customers=1000
management.endpoints.web.exposure.include=*

spring.datasource.url=jdbc:h2:mem:customers-db;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true