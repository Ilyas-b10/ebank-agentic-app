# Configuration centralisee de ebank-chatbot-service
# (la cle API et les tokens des bots restent dans ebank-chatbot-service ou en variables d'environnement)
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.0
chatbot.config.welcome-message=Bienvenue dans ebank-chatbot-service : posez vos questions sur les clients, les comptes et les operations.
management.endpoints.web.exposure.include=*